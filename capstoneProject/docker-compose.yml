services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-api
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    container_name: nodejs-capstone-project
    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodejs-capstone-db

    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: nodejs-capstone-project-redis
    restart: unless-stopped

    ports:
      - "6379:6379"
volumes:
  postgres_data:
