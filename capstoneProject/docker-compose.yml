services:
  postgres:
    image: postgres:16-alpine
    container_name: nodejs-capstone-project
    restart: unless-stopped

    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodejs-capstone-db

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
